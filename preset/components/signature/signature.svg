    <path seq="4" data-duration="248" stroke="url(#shanmaoy-ink)" d="M260 106 L246 141 C257 125 280 98 289 101 C299 104 282 127 283 137 C284 145 303 135 317 122"/>
    <!-- M: two generous, sloping peaks. -->
